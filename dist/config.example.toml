# Example config for gpaperd. Copy it to ~/.config/gpaperd/config.toml.
#
# gpaperd applies an edit of this file while it runs. A file that does not
# parse is reported in the log with line and column, and the running config
# stays. `gpaperctl reload` applies it at once and prints that error.
#
# http(s) sources are downloaded into ~/.cache/gpaperd/remote. A cached copy
# is shown at once, even offline, and checked again in the background; no
# rotation waits for the network. Downloads go through HTTP(S)_PROXY when it
# is set. GNOME's own proxy settings are not read.
# A URL whose host is a loopback, unspecified (0.0.0.0, [::]), private or
# link-local IP address is not fetched and not retried; use a host name.

[general]
interval = "15m"                 # 1m ..= 7d; the deadline survives restarts
order = "random"                 # "random" | "alphabetical"
picture_options = "zoom"         # optional; omit to leave GNOME's value alone
on_external_change = "pause"     # "pause" | "reassert-next-tick" | "reassert-now"
rotate_hidden = false            # rotate the style that is not on screen
empty_style = "use-other-style"  # or "keep-current"
remote_refresh = "startup"       # check http(s) sources for a new version:
                                 # "startup": once per daemon start
                                 # a duration of 1h or more, like "24h": at start, then that often
                                 # "never": only download what is not cached
link = true                      # hardlink or reflink when possible; false = always copy
apply_mode = "slots"             # "slots": rotate two slot files, keys written once
                                 # "uri": write each image's own URI to the keys
max_pixels = 100_000_000         # skip images with more pixels (width x height)
pause_when_locked = false        # stop the timers while the screen is locked

[light]
sources = [
  "~/Pictures/Wallpapers/light",                         # dir or file, decided at scan time
  { dir = "~/Pictures/Wallpapers/shared", recursive = true },
  { file = "~/Pictures/hero.jxl" },
  "https://example.com/wallpapers/dawn.jpg",
]

[dark]
interval = "30m"                 # per-style override
order = "alphabetical"
sources = [
  { dir = "/mnt/nas/wallpapers/dark", poll = "5m" },     # network fs: no inotify; 1s or more
  { url = "https://example.com/wallpapers/night.png" },
  "file:///srv/wall/aurora%20night.png",
]
