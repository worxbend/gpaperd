[workspace]
resolver = "3"
members = ["crates/core", "crates/ctl", "crates/daemon"]

[workspace.package]
version = "0.1.1"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/worxbend/gpaperd"

# Versions follow the plan's "Crates and versions" table.
[workspace.dependencies]
gpaperd-core = { path = "crates/core" }
gpaperd-ctl = { path = "crates/ctl" }

anyhow = "1.0.104"
async-channel = "2.5.0"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
gio = "0.22.10"
glib = "0.22.10"
glycin = { version = "4.0.5", default-features = false, features = ["tokio"] }
humantime = "2.4.0"
infer = { version = "0.22.0", default-features = false }
# gpaperctl prints the next change in local time: the system tz database
# only, no bundled one.
jiff = { version = "0.2.43", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
natord = "1.0.9"
# Without the defaults, which only add macOS backends.
notify = { version = "8.2.2", default-features = false }
notify-debouncer-full = { version = "0.7.0", default-features = false }
rand = { version = "0.10.3", default-features = false }
# `stream`: the plan's pin. The default features keep the default TLS backend
# and read HTTP(S)_PROXY from the environment.
reqwest = { version = "0.13.5", features = ["stream"] }
rustix = { version = "1.1.6", features = ["fs", "time"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
# Not in the plan's table: state.json needs a JSON codec.
serde_json = "1.0.154"
thiserror = "2.0.21"
# `time`: glycin's tokio backend needs the runtime's timers. The daemon's own
# deadlines stay on the timerfd.
# `fs`, `io-util`: remote downloads stream to a temp file in the cache.
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
# `display`: the cache writes meta.toml.
toml = { version = "1.2.1", default-features = false, features = ["display", "parse", "serde", "std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
url = "2.5.8"
walkdir = "2.5.0"
# Tokio only: no zruntime backend, no async-io. `proxy` for gpaperctl and the
# tests, `service` for the daemon's control interface.
zbus = { version = "6.3.0", default-features = false, features = ["proxy", "service", "tokio"] }

proptest = "1.12.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
