name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The toolchain the workspace is developed with.
  RUST_TOOLCHAIN: "1.99.1"

# Job caps reuse the Test step's 15 minutes (`timeout 900`): 15 per step
# that compiles or runs Rust code, plus 15 for the rest of the job.
jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # no compile: 15 for the job
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # no compile: 15 for the job
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Licences, advisories, bans and sources, as configured in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check

  test:
    runs-on: ubuntu-24.04
    # clippy + test build + test run (3 x 15) + the rest (15)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # GLib/GIO for GSettings, libseccomp and fontconfig for glycin;
      # dbus-daemon for the control tests, groff for the man page check.
      # glycin's loaders are not packaged here: glycin cannot decode, so
      # every real check fails as "file is incomplete". tests/probe.rs
      # asserts that, end-to-end scenarios that are not about decoding check
      # magic bytes only, and tests that need a decode print "skipped:".
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libglib2.0-bin libseccomp-dev \
            libfontconfig-dev dbus groff-base shellcheck
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build tests
        run: cargo test --workspace --locked --no-run
      # A runaway test must hit a cap, not the runner's memory: 8 GiB of
      # address space and 15 minutes.
      - name: Test
        run: |
          ulimit -v 8388608
          timeout 900 cargo test --workspace --locked --no-fail-fast
      - name: Docs match the code
        run: .github/scripts/check-docs.sh target/debug
      - name: Shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if (( ${#scripts[@]} > 0 )); then shellcheck "${scripts[@]}"; fi
